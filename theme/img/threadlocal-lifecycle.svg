<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 392" width="100%" role="img">
<title>一次请求里上下文的生命周期：注入、读取、跨线程丢失、出口清理</title>
<desc>Filter 注入上下文，Service 同线程读取必然命中；一旦进入异步线程或线程池就读不到，需要显式传参或 TTL 包装；响应前必须在 finally 里 remove，否则线程带着旧值回到池里，下一个请求串号。</desc>
<defs>
  <marker id="tl2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#9db4d4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="tl2r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#d08d85" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="tl2g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#7fae93" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif">

  <text x="40" y="34" font-size="13.5" fill="#6b7684">正常路径：一个请求一条线程，进出成对</text>

  <g>
    <rect x="40" y="50" width="190" height="64" rx="9" fill="#f6f9ff" stroke="#cfdffa" stroke-width="1"/>
    <text x="135" y="76" font-size="14.5" fill="#16324f" text-anchor="middle">① Filter / 拦截器</text>
    <text x="135" y="97" font-size="12.5" fill="#63707f" text-anchor="middle">set 租户、用户、traceId</text>
  </g>
  <path d="M233 82L251 82" fill="none" stroke="#9db4d4" stroke-width="1.5" marker-end="url(#tl2)"/>
  <g>
    <rect x="255" y="50" width="190" height="64" rx="9" fill="#e3eefc" stroke="#9dbcf0" stroke-width="1.2"/>
    <text x="350" y="76" font-size="14.5" fill="#12385f" text-anchor="middle">② Service / DAO</text>
    <text x="350" y="97" font-size="12.5" fill="#3d5f86" text-anchor="middle">get：同线程必然命中</text>
  </g>
  <path d="M448 82L466 82" fill="none" stroke="#9db4d4" stroke-width="1.5" marker-end="url(#tl2)"/>
  <g>
    <rect x="470" y="50" width="190" height="64" rx="9" fill="#f6f9ff" stroke="#cfdffa" stroke-width="1"/>
    <text x="565" y="76" font-size="14.5" fill="#16324f" text-anchor="middle">③ 统一出口</text>
    <text x="565" y="97" font-size="12.5" fill="#63707f" text-anchor="middle">remove 必须写在 finally</text>
  </g>
  <path d="M663 82L681 82" fill="none" stroke="#9db4d4" stroke-width="1.5" marker-end="url(#tl2)"/>
  <g>
    <rect x="685" y="50" width="190" height="64" rx="9" fill="#f1f8f3" stroke="#cfe6d8" stroke-width="1"/>
    <text x="780" y="76" font-size="14.5" fill="#2f6b46" text-anchor="middle">④ 线程归还线程池</text>
    <text x="780" y="97" font-size="12.5" fill="#4d7d63" text-anchor="middle">干净状态，下个请求可复用</text>
  </g>

  <path d="M350 117L350 152" fill="none" stroke="#d08d85" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#tl2r)"/>
  <text x="358" y="140" font-size="12" fill="#a1706a">异步分支在这里断开</text>

  <g>
    <rect x="40" y="158" width="392" height="82" rx="9" fill="#fdf1f0" stroke="#f0c8c4" stroke-width="1"/>
    <text x="56" y="182" font-size="13.5" fill="#8a3a30">✕ 读不到：@Async / CompletableFuture / 自建线程池</text>
    <text x="56" y="204" font-size="12.5" fill="#a1706a">线程池的线程在请求之前就创建好了，</text>
    <text x="56" y="224" font-size="12.5" fill="#a1706a">InheritableThreadLocal 拷贝的是它的出生快照</text>
  </g>
  <path d="M436 199L470 199" fill="none" stroke="#7fae93" stroke-width="1.5" marker-end="url(#tl2g)"/>
  <g>
    <rect x="476" y="158" width="384" height="82" rx="9" fill="#f1f8f3" stroke="#cfe6d8" stroke-width="1"/>
    <text x="492" y="182" font-size="13.5" fill="#2f6b46">✓ 处理：提交任务时把上下文带过去</text>
    <text x="492" y="204" font-size="12.5" fill="#4d7d63">显式传参 / TtlRunnable / TaskDecorator，</text>
    <text x="492" y="224" font-size="12.5" fill="#4d7d63">提交前快照，执行时回放，执行完还原</text>
  </g>

  <line x1="40" y1="266" x2="860" y2="266" stroke="#e3e7ee" stroke-width="1" stroke-dasharray="4 4"/>

  <g>
    <rect x="40" y="284" width="820" height="86" rx="9" fill="#fdf1f0" stroke="#f0c8c4" stroke-width="1.2"/>
    <text x="56" y="308" font-size="13.5" fill="#8a3a30">漏掉 remove：线程带着旧值回到池里</text>
    <text x="56" y="330" font-size="12.5" fill="#a1706a">抛异常、提前 return、异步分支提前返回 —— 都是 finally 走不到的路径，clean 责任必须放在最外层出口</text>
    <text x="56" y="352" font-size="12.5" fill="#a1706a">后果一：下一个请求 get 到上一个租户的 ID（串号 / 越权）；后果二：线程不退出，value 永远可达（泄漏）</text>
  </g>

</g>
</svg>
