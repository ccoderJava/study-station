<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" role="img">
<title>下拨四个时点的会计恒等式：冻结期间权益一分不动</title>
<desc>初始状态资产一百二十万、负债一百万、权益二十万。发起下拨只是把可用余额转成冻结，三项都不变；银行扣款后资产从备付金转成在途，总额仍是一百二十万；到账确认时资产和负债同时减一百万，权益仍是二十万；退票则原路回滚。全程资产减负债恒等于二十万，冻结保护的是这个等式不被击穿。</desc>
<defs>
  <marker id="ti1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#9db4d4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif">

  <text x="40" y="30" font-size="13.5" fill="#6b7684">下拨 100 万：四个时点，资产始终等于负债加权益（单位：万元）</text>

  <line x1="60" y1="62" x2="944" y2="62" stroke="#e3e7ee" stroke-width="1.4" marker-end="url(#ti1)"/>
  <text x="900" y="54" font-size="11" fill="#9aa5b4">时间</text>

  <!-- 卡片 1：冻结 -->
  <g>
    <line x1="145" y1="62" x2="145" y2="80" stroke="#cfdffa" stroke-width="1.2"/>
    <circle cx="145" cy="62" r="4" fill="#7fa6c9"/>
    <rect x="40" y="82" width="210" height="246" rx="9" fill="#ffffff" stroke="#cfdffa" stroke-width="1.2"/>
    <rect x="40" y="82" width="210" height="30" rx="9" fill="#eef4fb"/>
    <rect x="40" y="100" width="210" height="12" fill="#eef4fb"/>
    <text x="56" y="102" font-size="12" font-weight="600" fill="#2f5b7d">① 发起下拨</text>

    <text x="56" y="136" font-size="11" fill="#8593a3">资产</text>
    <text x="234" y="136" font-size="12" text-anchor="end" fill="#46505e">120</text>
    <rect x="56" y="144" width="178" height="5" rx="2.5" fill="#eef4fb"/>
    <rect x="56" y="144" width="178" height="5" rx="2.5" fill="#9dbcf0"/>

    <text x="56" y="172" font-size="11" fill="#8593a3">负债</text>
    <text x="234" y="172" font-size="12" text-anchor="end" fill="#46505e">100</text>
    <rect x="56" y="180" width="178" height="5" rx="2.5" fill="#eef4fb"/>
    <rect x="56" y="180" width="148" height="5" rx="2.5" fill="#f0c8c4"/>

    <text x="56" y="208" font-size="11" fill="#8593a3">权益</text>
    <text x="234" y="208" font-size="12" text-anchor="end" fill="#46505e">20</text>
    <rect x="56" y="216" width="178" height="5" rx="2.5" fill="#eef4fb"/>
    <rect x="56" y="216" width="30" height="5" rx="2.5" fill="#a8d5b8"/>

    <line x1="56" y1="234" x2="234" y2="234" stroke="#eef1f5" stroke-width="1"/>
    <text x="56" y="254" font-size="11" fill="#3d5f86">可用 100 → 冻结 100</text>
    <text x="56" y="272" font-size="11" fill="#8593a3">负债总额没变，</text>
    <text x="56" y="288" font-size="11" fill="#8593a3">只是这笔钱不能动了</text>
    <text x="56" y="312" font-size="11.5" font-weight="600" fill="#2f6b46">恒等式成立</text>
  </g>

  <!-- 卡片 2：出账 -->
  <g>
    <line x1="375" y1="62" x2="375" y2="80" stroke="#ddb98d" stroke-width="1.2"/>
    <circle cx="375" cy="62" r="4" fill="#c98d6a"/>
    <rect x="270" y="82" width="210" height="246" rx="9" fill="#ffffff" stroke="#e8d3b8" stroke-width="1.2"/>
    <rect x="270" y="82" width="210" height="30" rx="9" fill="#fdf6ec"/>
    <rect x="270" y="100" width="210" height="12" fill="#fdf6ec"/>
    <text x="286" y="102" font-size="12" font-weight="600" fill="#8a5a30">② 银行扣款</text>

    <text x="286" y="136" font-size="11" fill="#8593a3">资产</text>
    <text x="464" y="136" font-size="12" text-anchor="end" fill="#46505e">120</text>
    <rect x="286" y="144" width="178" height="5" rx="2.5" fill="#eef4fb"/>
    <rect x="286" y="144" width="178" height="5" rx="2.5" fill="#9dbcf0"/>

    <text x="286" y="172" font-size="11" fill="#8593a3">负债</text>
    <text x="464" y="172" font-size="12" text-anchor="end" fill="#46505e">100</text>
    <rect x="286" y="180" width="178" height="5" rx="2.5" fill="#eef4fb"/>
    <rect x="286" y="180" width="148" height="5" rx="2.5" fill="#f0c8c4"/>

    <text x="286" y="208" font-size="11" fill="#8593a3">权益</text>
    <text x="464" y="208" font-size="12" text-anchor="end" fill="#46505e">20</text>
    <rect x="286" y="216" width="178" height="5" rx="2.5" fill="#eef4fb"/>
    <rect x="286" y="216" width="30" height="5" rx="2.5" fill="#a8d5b8"/>

    <line x1="286" y1="234" x2="464" y2="234" stroke="#eef1f5" stroke-width="1"/>
    <text x="286" y="254" font-size="11" fill="#8a5a30">备付金 20 + 在途 100</text>
    <text x="286" y="272" font-size="11" fill="#8593a3">资产只是换了形态，</text>
    <text x="286" y="288" font-size="11" fill="#8593a3">总额没少，负债还挂着</text>
    <text x="286" y="312" font-size="11.5" font-weight="600" fill="#2f6b46">恒等式成立</text>
  </g>

  <!-- 卡片 3：到账 -->
  <g>
    <line x1="605" y1="62" x2="605" y2="80" stroke="#a8d5b8" stroke-width="1.2"/>
    <circle cx="605" cy="62" r="4" fill="#6aa87f"/>
    <rect x="500" y="82" width="210" height="246" rx="9" fill="#ffffff" stroke="#cfe6d8" stroke-width="1.2"/>
    <rect x="500" y="82" width="210" height="30" rx="9" fill="#f1f8f3"/>
    <rect x="500" y="100" width="210" height="12" fill="#f1f8f3"/>
    <text x="516" y="102" font-size="12" font-weight="600" fill="#2f6b46">③ 到账确认</text>

    <text x="516" y="136" font-size="11" fill="#8593a3">资产</text>
    <text x="694" y="136" font-size="12" text-anchor="end" fill="#46505e">20</text>
    <rect x="516" y="144" width="178" height="5" rx="2.5" fill="#eef4fb"/>
    <rect x="516" y="144" width="30" height="5" rx="2.5" fill="#9dbcf0"/>

    <text x="516" y="172" font-size="11" fill="#8593a3">负债</text>
    <text x="694" y="172" font-size="12" text-anchor="end" fill="#46505e">0</text>
    <rect x="516" y="180" width="178" height="5" rx="2.5" fill="#eef4fb"/>

    <text x="516" y="208" font-size="11" fill="#8593a3">权益</text>
    <text x="694" y="208" font-size="12" text-anchor="end" fill="#46505e">20</text>
    <rect x="516" y="216" width="178" height="5" rx="2.5" fill="#eef4fb"/>
    <rect x="516" y="216" width="30" height="5" rx="2.5" fill="#a8d5b8"/>

    <line x1="516" y1="234" x2="694" y2="234" stroke="#eef1f5" stroke-width="1"/>
    <text x="516" y="254" font-size="11" fill="#2f6b46">资产 −100，负债 −100</text>
    <text x="516" y="272" font-size="11" fill="#8593a3">同向减少，才是真正的</text>
    <text x="516" y="288" font-size="11" fill="#8593a3">清偿；权益仍是 20</text>
    <text x="516" y="312" font-size="11.5" font-weight="600" fill="#2f6b46">恒等式成立</text>
  </g>

  <!-- 卡片 4：退票 -->
  <g>
    <line x1="835" y1="62" x2="835" y2="80" stroke="#f0c8c4" stroke-width="1.2"/>
    <circle cx="835" cy="62" r="4" fill="#d08d85"/>
    <rect x="730" y="82" width="210" height="246" rx="9" fill="#ffffff" stroke="#f0c8c4" stroke-width="1.2"/>
    <rect x="730" y="82" width="210" height="30" rx="9" fill="#fdf1f0"/>
    <rect x="730" y="100" width="210" height="12" fill="#fdf1f0"/>
    <text x="746" y="102" font-size="12" font-weight="600" fill="#8a3a30">④ 退票回滚</text>

    <text x="746" y="136" font-size="11" fill="#8593a3">资产</text>
    <text x="924" y="136" font-size="12" text-anchor="end" fill="#46505e">120</text>
    <rect x="746" y="144" width="178" height="5" rx="2.5" fill="#eef4fb"/>
    <rect x="746" y="144" width="178" height="5" rx="2.5" fill="#9dbcf0"/>

    <text x="746" y="172" font-size="11" fill="#8593a3">负债</text>
    <text x="924" y="172" font-size="12" text-anchor="end" fill="#46505e">100</text>
    <rect x="746" y="180" width="178" height="5" rx="2.5" fill="#eef4fb"/>
    <rect x="746" y="180" width="148" height="5" rx="2.5" fill="#f0c8c4"/>

    <text x="746" y="208" font-size="11" fill="#8593a3">权益</text>
    <text x="924" y="208" font-size="12" text-anchor="end" fill="#46505e">20</text>
    <rect x="746" y="216" width="178" height="5" rx="2.5" fill="#eef4fb"/>
    <rect x="746" y="216" width="30" height="5" rx="2.5" fill="#a8d5b8"/>

    <line x1="746" y1="234" x2="924" y2="234" stroke="#eef1f5" stroke-width="1"/>
    <text x="746" y="254" font-size="11" fill="#8a3a30">冻结 → 可用</text>
    <text x="746" y="272" font-size="11" fill="#8593a3">钱原路退回，账也</text>
    <text x="746" y="288" font-size="11" fill="#8593a3">原路回滚，一步不少</text>
    <text x="746" y="312" font-size="11.5" font-weight="600" fill="#2f6b46">恒等式成立</text>
  </g>

  <!-- 底部结论 -->
  <g>
    <rect x="40" y="348" width="530" height="70" rx="8" fill="#fbfcfe" stroke="#e3e7ee" stroke-width="1"/>
    <text x="58" y="372" font-size="12.5" fill="#46505e">四个时点里，资产 − 负债 始终等于 20 万</text>
    <text x="58" y="394" font-size="11.5" fill="#8593a3">冻结改的只是「负债能不能动」，不改「负债有多少」；</text>
    <text x="58" y="410" font-size="11.5" fill="#8593a3">权益只有在多付、重复付的时候才会被击穿。</text>
  </g>

  <g>
    <rect x="590" y="348" width="370" height="70" rx="8" fill="#fdf1f0" stroke="#f0c8c4" stroke-width="1.2"/>
    <text x="608" y="372" font-size="12.5" font-weight="600" fill="#8a3a30">不冻结的后果：同一笔负债付两次</text>
    <text x="608" y="394" font-size="11.5" fill="#a1706a">资产 120 − 200 = −80，负债 0，权益 −80</text>
    <text x="608" y="410" font-size="11.5" fill="#a1706a">从 +20 到 −80，20 万自有资金被 100 万缺口吃掉</text>
  </g>

  <text x="40" y="452" font-size="11.5" fill="#9aa5b4">注：数字为示意，假设商户余额 100 万、备付金 120 万、平台自有资金 20 万。</text>
  <text x="40" y="474" font-size="11.5" fill="#9aa5b4">监管口径上，客户备付金不得挪用；多付的资金只能由平台自有资金填补，直接冲减权益。</text>

</g>
</svg>
