<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" role="img">
<title>慢 SQL 的治理顺序：先改 SQL 形态，再调索引，再改表结构，最后才改架构</title>
<desc>四级治理手段按成本从低到高排列：改 SQL 形态零成本、可灰度可回滚；调索引有写入代价、要走 DDL；改表结构要迁移、要双写；改架构动全局、几乎不可逆。每一级都有明确的升级信号，能停在前一步就不要往后走。</desc>
<defs>
  <marker id="so1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#b9c3d0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif">

  <text x="40" y="28" font-size="13.5" fill="#6b7684">优化的顺序不是「哪个见效快先做哪个」，而是「哪个便宜且可逆先做哪个」</text>
  <text x="40" y="74" font-size="11" fill="#9aa5b1">成本 / 回滚难度递增</text>
  <path d="M40 88L852 88" fill="none" stroke="#b9c3d0" stroke-width="1.4" marker-end="url(#so1)"/>

  <!-- 第 1 级 -->
  <rect x="40" y="102" width="193" height="258" rx="9" fill="#f1f8f3" stroke="#cfe6d8" stroke-width="1.2"/>
  <text x="56" y="128" font-size="10.5" fill="#6f9182">第 1 级</text>
  <text x="56" y="154" font-size="14" fill="#2f6b46" font-weight="600">改 SQL 形态</text>
  <text x="56" y="174" font-size="10.5" fill="#6f9182">零成本 · 可灰度 · 可回滚</text>
  <line x1="56" y1="188" x2="217" y2="188" stroke="#cfe6d8" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="56" y="212" font-size="11" fill="#3f7057">去掉列上的函数</text>
  <text x="56" y="234" font-size="11" fill="#3f7057">or 拆成 union all</text>
  <text x="56" y="256" font-size="11" fill="#3f7057">深分页改游标</text>
  <text x="56" y="278" font-size="11" fill="#3f7057">只取需要的列</text>
  <rect x="52" y="294" width="169" height="54" rx="6" fill="#ffffff" stroke="#cfe6d8" stroke-width="1"/>
  <text x="64" y="313" font-size="10" fill="#8593a3">什么时候走这一步</text>
  <text x="64" y="333" font-size="11" fill="#2f6b46" font-weight="600">任何情况都先做这一步</text>

  <!-- 第 2 级 -->
  <rect x="249" y="102" width="193" height="258" rx="9" fill="#f6f9ff" stroke="#cfdffa" stroke-width="1.2"/>
  <text x="265" y="128" font-size="10.5" fill="#5f7fa8">第 2 级</text>
  <text x="265" y="154" font-size="14" fill="#12385f" font-weight="600">调索引</text>
  <text x="265" y="174" font-size="10.5" fill="#5f7fa8">有写入代价 · 要 DDL</text>
  <line x1="265" y1="188" x2="426" y2="188" stroke="#cfdffa" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="265" y="212" font-size="11" fill="#3d5f86">补列 / 调列序</text>
  <text x="265" y="234" font-size="11" fill="#3d5f86">加覆盖索引消回表</text>
  <text x="265" y="256" font-size="11" fill="#3d5f86">删冗余索引</text>
  <text x="265" y="278" font-size="11" fill="#3d5f86">单表控制在 5 个内</text>
  <rect x="261" y="294" width="169" height="54" rx="6" fill="#ffffff" stroke="#cfdffa" stroke-width="1"/>
  <text x="273" y="313" font-size="10" fill="#8593a3">什么时候走这一步</text>
  <text x="273" y="333" font-size="11" fill="#12385f" font-weight="600">改完 SQL 后 rows 还大</text>

  <!-- 第 3 级 -->
  <rect x="458" y="102" width="193" height="258" rx="9" fill="#fdf8ef" stroke="#ecd9b6" stroke-width="1.2"/>
  <text x="474" y="128" font-size="10.5" fill="#a08a5e">第 3 级</text>
  <text x="474" y="154" font-size="14" fill="#7a5a20" font-weight="600">改表结构</text>
  <text x="474" y="174" font-size="10.5" fill="#a08a5e">要迁移 · 要双写 · 有风险</text>
  <line x1="474" y1="188" x2="635" y2="188" stroke="#ecd9b6" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="474" y="212" font-size="11" fill="#8a6a2e">冗余字段</text>
  <text x="474" y="234" font-size="11" fill="#8a6a2e">汇总表 / 结果表</text>
  <text x="474" y="256" font-size="11" fill="#8a6a2e">按时间分区</text>
  <text x="474" y="278" font-size="11" fill="#8a6a2e">冷热分离 / 归档</text>
  <rect x="470" y="294" width="169" height="54" rx="6" fill="#ffffff" stroke="#ecd9b6" stroke-width="1"/>
  <text x="482" y="313" font-size="10" fill="#8593a3">什么时候走这一步</text>
  <text x="482" y="333" font-size="11" fill="#7a5a20" font-weight="600">索引已 5 个还不够用</text>

  <!-- 第 4 级 -->
  <rect x="667" y="102" width="193" height="258" rx="9" fill="#fdf1f0" stroke="#f0c8c4" stroke-width="1.2"/>
  <text x="683" y="128" font-size="10.5" fill="#b08b85">第 4 级</text>
  <text x="683" y="154" font-size="14" fill="#8a3a30" font-weight="600">改架构</text>
  <text x="683" y="174" font-size="10.5" fill="#b08b85">动全局 · 几乎不可逆</text>
  <line x1="683" y1="188" x2="844" y2="188" stroke="#f0c8c4" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="683" y="212" font-size="11" fill="#a1706a">读写分离 / 加缓存</text>
  <text x="683" y="234" font-size="11" fill="#a1706a">ES / ClickHouse</text>
  <text x="683" y="256" font-size="11" fill="#a1706a">分库分表</text>
  <text x="683" y="278" font-size="11" fill="#a1706a">换存储引擎 / 换库</text>
  <rect x="679" y="294" width="169" height="54" rx="6" fill="#ffffff" stroke="#f0c8c4" stroke-width="1"/>
  <text x="691" y="313" font-size="10" fill="#8593a3">什么时候走这一步</text>
  <text x="691" y="333" font-size="11" fill="#8a3a30" font-weight="600">单表亿级才考虑</text>

  <text x="40" y="392" font-size="12" fill="#8593a3">跳过第 1 级直接加索引，是最常见的错误：索引一旦加上就要长期为它付写入成本，而改写法是零成本的。</text>

</g>
</svg>
