<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" role="img">
<title>索引下推：同一个 SQL，没有 ICP 回表 1000 次，有 ICP 只回表 20 次</title>
<desc>联合索引 (name, age) 上执行 where name like '张%' and age = 25。name 是范围条件，age 用不上定位。没有索引下推时，引擎把命中 name 的 1000 条全部回表交给 server 层再过滤 age，980 次回表是白跑的；有索引下推时，age 就在索引里，引擎在二级索引上先判掉，只对剩下 20 条回表。</desc>
<defs>
  <marker id="ic1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#9db4d4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif">

  <text x="40" y="28" font-size="13.5" fill="#6b7684">同一个 SQL，有没有索引下推：回表 1000 次 vs 20 次</text>

  <text x="40" y="52" font-size="11.5" fill="#8593a3">表 t_user，联合索引 idx_name_age(name, age)　·　</text>
  <text x="330" y="52" font-size="11.5" fill="#5f7fa8" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">where name like '张%' and age = 25</text>

  <!-- 上：无 ICP -->
  <rect x="40" y="72" width="820" height="140" rx="10" fill="#fdf7f6" stroke="#f0c8c4" stroke-width="1.2"/>
  <text x="56" y="136" font-size="12.5" fill="#8a3a30" font-weight="600">无 ICP</text>
  <text x="56" y="156" font-size="11" fill="#b08b85">5.5 及更早</text>

  <rect x="148" y="102" width="160" height="72" rx="7" fill="#ffffff" stroke="#e3e7ee" stroke-width="1.1"/>
  <text x="160" y="124" font-size="11.5" fill="#46505e" font-weight="600">扫二级索引</text>
  <text x="160" y="146" font-size="10.5" fill="#6b7684" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">name like '张%'</text>
  <text x="160" y="164" font-size="10.5" fill="#6b7684">命中 1000 条</text>

  <path d="M310 138L326 138" fill="none" stroke="#9db4d4" stroke-width="1.5" marker-end="url(#ic1)"/>

  <rect x="328" y="102" width="160" height="72" rx="7" fill="#fdf1f0" stroke="#f0c8c4" stroke-width="1.1"/>
  <text x="340" y="124" font-size="11.5" fill="#8a3a30" font-weight="600">逐条回表</text>
  <text x="340" y="148" font-size="10.5" fill="#a1706a">1000 次随机 IO</text>
  <text x="340" y="168" font-size="10.5" fill="#a1706a">整行交给上层</text>

  <path d="M490 138L506 138" fill="none" stroke="#9db4d4" stroke-width="1.5" marker-end="url(#ic1)"/>

  <rect x="508" y="102" width="160" height="72" rx="7" fill="#ffffff" stroke="#e3e7ee" stroke-width="1.1"/>
  <text x="520" y="124" font-size="11.5" fill="#46505e" font-weight="600">server 层过滤</text>
  <text x="520" y="146" font-size="10.5" fill="#6b7684">age = 25</text>
  <text x="520" y="164" font-size="10.5" fill="#6b7684">剩 20 条</text>

  <path d="M670 138L686 138" fill="none" stroke="#9db4d4" stroke-width="1.5" marker-end="url(#ic1)"/>

  <rect x="688" y="102" width="160" height="72" rx="7" fill="#ffffff" stroke="#e3e7ee" stroke-width="1.1"/>
  <text x="700" y="124" font-size="11.5" fill="#46505e" font-weight="600">返回</text>
  <text x="700" y="146" font-size="10.5" fill="#6b7684">20 条</text>

  <text x="844" y="200" font-size="11.5" fill="#a1706a" text-anchor="end">回表 1000 次，其中 980 次白跑</text>

  <!-- 下：有 ICP -->
  <rect x="40" y="232" width="820" height="140" rx="10" fill="#f4faf6" stroke="#cfe6d8" stroke-width="1.2"/>
  <text x="56" y="296" font-size="12.5" fill="#2f6b46" font-weight="600">有 ICP</text>
  <text x="56" y="316" font-size="11" fill="#6f9182">5.6 起默认</text>

  <rect x="148" y="262" width="160" height="72" rx="7" fill="#ffffff" stroke="#e3e7ee" stroke-width="1.1"/>
  <text x="160" y="284" font-size="11.5" fill="#46505e" font-weight="600">扫二级索引</text>
  <text x="160" y="306" font-size="10.5" fill="#6b7684" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">name like '张%'</text>
  <text x="160" y="324" font-size="10.5" fill="#6b7684">命中 1000 条</text>

  <path d="M310 298L326 298" fill="none" stroke="#9db4d4" stroke-width="1.5" marker-end="url(#ic1)"/>

  <rect x="328" y="262" width="160" height="72" rx="7" fill="#eaf6ef" stroke="#9dcfae" stroke-width="1.3"/>
  <text x="340" y="284" font-size="11.5" fill="#2f6b46" font-weight="600">引擎层先过滤</text>
  <text x="340" y="306" font-size="10.5" fill="#3f7057">age 就在索引里</text>
  <text x="340" y="326" font-size="10.5" fill="#3f7057">1000 条 → 20 条</text>

  <path d="M490 298L506 298" fill="none" stroke="#9db4d4" stroke-width="1.5" marker-end="url(#ic1)"/>

  <rect x="508" y="262" width="160" height="72" rx="7" fill="#ffffff" stroke="#e3e7ee" stroke-width="1.1"/>
  <text x="520" y="284" font-size="11.5" fill="#46505e" font-weight="600">只对这 20 条回表</text>
  <text x="520" y="306" font-size="10.5" fill="#6b7684">20 次随机 IO</text>

  <path d="M670 298L686 298" fill="none" stroke="#9db4d4" stroke-width="1.5" marker-end="url(#ic1)"/>

  <rect x="688" y="262" width="160" height="72" rx="7" fill="#ffffff" stroke="#e3e7ee" stroke-width="1.1"/>
  <text x="700" y="284" font-size="11.5" fill="#46505e" font-weight="600">返回</text>
  <text x="700" y="306" font-size="10.5" fill="#6b7684">20 条</text>

  <text x="844" y="360" font-size="11.5" fill="#3f7057" text-anchor="end">回表 20 次，扫描行数没变</text>

  <text x="40" y="402" font-size="12" fill="#8593a3">索引下推减少的是回表次数，不是扫描行数 —— 索引该扫 1000 条还是 1000 条，省掉的是 980 次随机 IO。</text>

</g>
</svg>
