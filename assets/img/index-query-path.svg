<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 584" width="100%" role="img">
<title>一条二级索引查询的完整路径：第一棵树定位主键，第二棵树回表取整行</title>
<desc>二级索引 idx_merchant(merchant_no, biz_date) 的叶子只存索引列和主键，定位到主键 1001 后要去聚簇索引再查一次才能拿到整行，这一步叫回表。要查的列全在索引里就是覆盖索引，停在第一棵树；where 里还有索引内的列时，可以先在二级索引上过滤再回表，这是索引下推。</desc>
<defs>
  <marker id="iq1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#9db4d4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="iq2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#d08d85" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif">
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">

  <text x="40" y="28" font-size="13.5" fill="#6b7684" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif">一条二级索引查询要走两棵树：先在索引里定位主键，再回表取整行</text>

  <rect x="40" y="44" width="820" height="42" rx="8" fill="#f6f9ff" stroke="#cfdffa" stroke-width="1.2"/>
  <text x="56" y="70" font-size="13" fill="#16324f">select * from t_order where merchant_no = 'M123'</text>
  <text x="844" y="70" font-size="11.5" fill="#8593a3" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif">索引 idx_merchant(merchant_no, biz_date)</text>

  <!-- 左：二级索引 -->
  <text x="40" y="110" font-size="13" fill="#12385f" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif">① 二级索引：叶子只有「索引列 + 主键」</text>

  <rect x="40" y="122" width="360" height="56" rx="8" fill="#fbfcfe" stroke="#e3e7ee" stroke-width="1.2"/>
  <text x="54" y="142" font-size="11" fill="#8593a3" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif">根页 / 非叶子，常驻内存</text>
  <text x="54" y="165" font-size="14" fill="#16324f">M001 │ M400 │ M800</text>

  <path d="M220 178L220 192" fill="none" stroke="#9db4d4" stroke-width="1.5" marker-end="url(#iq1)"/>
  <text x="232" y="190" font-size="11" fill="#8593a3" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif">二分定位</text>

  <rect x="40" y="196" width="360" height="140" rx="8" fill="#e3eefc" stroke="#9dbcf0" stroke-width="1.2"/>
  <text x="54" y="216" font-size="11" fill="#5f7fa8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif">叶子页 / 按 merchant_no 有序，页间双向链表</text>
  <text x="60" y="244" font-size="14" fill="#2b4a6f">M100 │ 11-01 │ 998</text>
  <rect x="52" y="278" width="200" height="26" rx="4" fill="#ffffff" stroke="#9dbcf0" stroke-width="1.2"/>
  <text x="60" y="296" font-size="14" fill="#12385f" font-weight="600">M123 │ 11-03 │ 1001</text>
  <text x="60" y="322" font-size="14" fill="#2b4a6f">M200 │ 11-03 │ 1003</text>

  <text x="40" y="358" font-size="11.5" fill="#5f7fa8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif">不存金额、状态、摘要 —— 所以它比表窄得多，一页能放很多条</text>

  <!-- 右：聚簇索引 -->
  <text x="500" y="110" font-size="13" fill="#2f6b46" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif">② 聚簇索引：叶子就是整行，也就是表本身</text>

  <rect x="500" y="122" width="360" height="56" rx="8" fill="#fbfcfe" stroke="#e3e7ee" stroke-width="1.2"/>
  <text x="514" y="142" font-size="11" fill="#8593a3" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif">根页 / 按主键有序</text>
  <text x="514" y="165" font-size="14" fill="#16324f">800 │ 1500 │ 3000</text>

  <path d="M680 178L680 192" fill="none" stroke="#9db4d4" stroke-width="1.5" marker-end="url(#iq1)"/>
  <text x="692" y="190" font-size="11" fill="#8593a3" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif">按 id=1001 二分</text>

  <rect x="500" y="196" width="360" height="140" rx="8" fill="#f1f8f3" stroke="#cfe6d8" stroke-width="1.2"/>
  <text x="514" y="216" font-size="11" fill="#6f9182" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif">叶子页 = 数据页 / 一整行都在这里</text>
  <rect x="512" y="278" width="290" height="26" rx="4" fill="#ffffff" stroke="#cfe6d8" stroke-width="1.2"/>
  <text x="520" y="296" font-size="13" fill="#2f6b46" font-weight="600">1001 │ M123 │ 5000.00 │ SUCCESS</text>
  <text x="520" y="244" font-size="13" fill="#4d7d63">0998 │ M100 │ 320.00  │ SUCCESS</text>
  <text x="520" y="322" font-size="13" fill="#4d7d63">1003 │ M200 │ 800.00  │ FAIL</text>

  <text x="500" y="358" font-size="11.5" fill="#6f9182" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif">命中的主键是乱序的 → 每次都换页 → 随机 IO</text>

  <!-- 回表箭头 -->
  <path d="M404 275L496 275" fill="none" stroke="#d08d85" stroke-width="1.6" marker-end="url(#iq2)"/>
  <text x="450" y="264" font-size="11.5" fill="#a1706a" text-anchor="middle" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif">② 回表</text>

  <line x1="40" y1="386" x2="860" y2="386" stroke="#e3e7ee" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- 三条截断路径 -->
  <rect x="40" y="402" width="260" height="146" rx="9" fill="#f1f8f3" stroke="#cfe6d8" stroke-width="1.2"/>
  <text x="56" y="426" font-size="12.5" fill="#2f6b46" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif">✓ 停在 ①：覆盖索引</text>
  <text x="56" y="450" font-size="11" fill="#4d7d63">select merchant_no, biz_date</text>
  <text x="56" y="469" font-size="11" fill="#4d7d63">from t_order where merchant_no=?</text>
  <text x="56" y="496" font-size="11.5" fill="#2f6b46" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif">要的列全在索引里，不回表</text>
  <text x="56" y="522" font-size="11" fill="#6f9182">Extra: Using index</text>

  <rect x="320" y="402" width="260" height="146" rx="9" fill="#f6f9ff" stroke="#cfdffa" stroke-width="1.2"/>
  <text x="336" y="426" font-size="12.5" fill="#12385f" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif">① 之后先过滤：索引下推</text>
  <text x="336" y="450" font-size="11" fill="#3d5f86">where merchant_no like 'M%'</text>
  <text x="336" y="469" font-size="11" fill="#3d5f86">  and biz_date = '2026-11-03'</text>
  <text x="336" y="496" font-size="11.5" fill="#12385f" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif">biz_date 在索引里 → 先过滤再回表</text>
  <text x="336" y="522" font-size="11" fill="#5f7fa8">Extra: Using index condition</text>

  <rect x="600" y="402" width="260" height="146" rx="9" fill="#fdf1f0" stroke="#f0c8c4" stroke-width="1.2"/>
  <text x="616" y="426" font-size="12.5" fill="#8a3a30" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif">① + ② 都要：回表</text>
  <text x="616" y="450" font-size="11" fill="#a1706a">select * from t_order</text>
  <text x="616" y="469" font-size="11" fill="#a1706a">where merchant_no = 'M123'</text>
  <text x="616" y="496" font-size="11.5" fill="#8a3a30" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif">金额、状态不在索引里</text>
  <text x="616" y="518" font-size="11" fill="#b08b85">命中几行就回表几次（随机 IO）</text>

  <text x="40" y="570" font-size="12" fill="#8593a3" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif">覆盖、下推、回表不是三个知识点，是同一条链上的三个截断点——判断一条 SQL 快不快，就是看它停在哪一段、回表几次。</text>

</g>
</g>
</svg>
