<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 372" width="100%" role="img">
<title>execute 的四道闸门：核心线程、队列、非核心线程、拒绝策略</title>
<desc>提交任务后依次经过四道判断：核心线程未满就建核心线程，核心满了入队列，队列满了才建非核心线程，非核心也满了才走拒绝策略。队列容量决定了后两道闸门能否被触发，无界队列会让 maximumPoolSize 永远不生效。</desc>
<defs>
  <marker id="tp1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#9db4d4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="tp1r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#d08d85" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif">

  <text x="40" y="32" font-size="13.5" fill="#6b7684">execute(task)：四道闸门依次判断，前一道没过才进下一道</text>

  <g>
    <rect x="40" y="48" width="190" height="74" rx="9" fill="#f1f8f3" stroke="#cfe6d8" stroke-width="1.2"/>
    <text x="56" y="74" font-size="14" fill="#2f6b46">① 核心线程未满</text>
    <text x="56" y="96" font-size="12.5" fill="#4d7d63">建核心线程，直接执行</text>
    <text x="56" y="114" font-size="11.5" fill="#6f9182">activeCount &lt; corePoolSize</text>
  </g>
  <path d="M233 85L251 85" fill="none" stroke="#9db4d4" stroke-width="1.5" marker-end="url(#tp1)"/>

  <g>
    <rect x="255" y="48" width="190" height="74" rx="9" fill="#f6f9ff" stroke="#cfdffa" stroke-width="1.2"/>
    <text x="271" y="74" font-size="14" fill="#16324f">② 核心已满 → 入队</text>
    <text x="271" y="96" font-size="12.5" fill="#63707f">workQueue.offer(task)</text>
    <text x="271" y="114" font-size="11.5" fill="#8593a3">队列没满就不会再建线程</text>
  </g>
  <path d="M448 85L466 85" fill="none" stroke="#9db4d4" stroke-width="1.5" marker-end="url(#tp1)"/>

  <g>
    <rect x="470" y="48" width="190" height="74" rx="9" fill="#e3eefc" stroke="#9dbcf0" stroke-width="1.2"/>
    <text x="486" y="74" font-size="14" fill="#12385f">③ 队列也满 → 扩容</text>
    <text x="486" y="96" font-size="12.5" fill="#3d5f86">建非核心线程，上限 max</text>
    <text x="486" y="114" font-size="11.5" fill="#5f7fa8">addWorker(task, false)</text>
  </g>
  <path d="M663 85L681 85" fill="none" stroke="#d08d85" stroke-width="1.5" marker-end="url(#tp1r)"/>

  <g>
    <rect x="685" y="48" width="190" height="74" rx="9" fill="#fdf1f0" stroke="#f0c8c4" stroke-width="1.2"/>
    <text x="701" y="74" font-size="14" fill="#8a3a30">④ 仍满 → 拒绝策略</text>
    <text x="701" y="96" font-size="12.5" fill="#a1706a">Abort / CallerRuns / 丢弃</text>
    <text x="701" y="114" font-size="11.5" fill="#b08b85">rejectedExecution(...)</text>
  </g>

  <g>
    <rect x="40" y="150" width="820" height="46" rx="8" fill="#fbfcfe" stroke="#e3e7ee" stroke-width="1"/>
    <text x="56" y="171" font-size="12.5" fill="#46505e">三个数字决定你在第几道闸门被拦：</text>
    <text x="56" y="188" font-size="12.5" fill="#6b7684">corePoolSize · maximumPoolSize · workQueue 容量 —— 三者共同决定「能同时压多少任务」，少调一个都会失衡</text>
  </g>

  <line x1="40" y1="216" x2="860" y2="216" stroke="#e3e7ee" stroke-width="1" stroke-dasharray="4 4"/>

  <g>
    <rect x="40" y="234" width="400" height="106" rx="9" fill="#fdf1f0" stroke="#f0c8c4" stroke-width="1.2"/>
    <text x="56" y="258" font-size="13.5" fill="#8a3a30">✕ 无界队列：③④ 永远到不了</text>
    <text x="56" y="280" font-size="12.5" fill="#a1706a">new LinkedBlockingQueue() 容量是 Integer.MAX_VALUE，</text>
    <text x="56" y="299" font-size="12.5" fill="#a1706a">队列几乎不会满 → maximumPoolSize 形同虚设</text>
    <text x="56" y="322" font-size="12.5" fill="#a1706a">压力不会消失，只是从「拒绝」变成了「堆内存上涨」</text>
  </g>

  <g>
    <rect x="460" y="234" width="400" height="106" rx="9" fill="#f1f8f3" stroke="#cfe6d8" stroke-width="1.2"/>
    <text x="476" y="258" font-size="13.5" fill="#2f6b46">✓ 有界队列：四道闸门都活着</text>
    <text x="476" y="280" font-size="12.5" fill="#4d7d63">new LinkedBlockingQueue(2000)：队列会被撞满，</text>
    <text x="476" y="299" font-size="12.5" fill="#4d7d63">max 才真正成为第二道弹性，拒绝才成为背压信号</text>
    <text x="476" y="322" font-size="12.5" fill="#4d7d63">代价：必须自己决定「满了以后丢还是等」</text>
  </g>

</g>
</svg>
